<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" role="img" aria-label="Conversión XML ↔ JSON">
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#334155" stroke-width="1.4"/></marker></defs>
<rect width="1120" height="650" rx="22" fill="#f8fafc"/>
<text x="45" y="60" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#0f172a">Conversión XML ↔ JSON</text>
<text x="45" y="94" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#475569">Dos enfoques: construir la salida manualmente o usar un modelo Java</text>
<rect x="45" y="170" width="475" height="335" rx="15" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
<text x="65" y="205" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#0f172a">Conversión manual</text>
<text x="65" y="238" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1e293b">XML → DOM / SAX / XPath</text>
<text x="65" y="264" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1e293b">Extraer campos del documento</text>
<text x="65" y="290" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1e293b">Construir JSON con Gson u org.json</text>
<text x="65" y="316" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1e293b"></text>
<text x="65" y="342" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1e293b">JSON → biblioteca JSON → DOM → XML</text>
<rect x="600" y="170" width="475" height="335" rx="15" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
<text x="620" y="205" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#0f172a">Conversión mediante objetos</text>
<text x="620" y="238" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1e293b">XML ↔ objeto Java con JAXB</text>
<text x="620" y="264" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1e293b">Objeto Java ↔ JSON con Gson</text>
<text x="620" y="290" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1e293b"></text>
<text x="620" y="316" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1e293b">Reutiliza el mismo modelo de datos</text>
<text x="620" y="342" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1e293b">Hay que definir las correspondencias</text>
<text x="560" y="565" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#475569">Importante: atributos, listas, tipos y valores nulos no siempre se convierten 1 a 1</text>
</svg>