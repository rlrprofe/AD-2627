          - Flujos de bytes: ut1/01-ficheros/03-flujos-bytes.md
          - Flujos de caracteres: ut1/01-ficheros/04-flujos-caracteres.md
          - Excepciones: ut1/01-ficheros/05-excepciones.md
          - Resumen: ut1/01-ficheros/06-resumen.md

      - "2. Serialización de objetos":
          - Introducción: ut1/02-serializacion/index.md
          - Serializable y transient: ut1/02-serializacion/01-conceptos.md
          - Serializar y deserializar: ut1/02-serializacion/02-un-objeto.md
          - Varios objetos: ut1/02-serializacion/03-varios-objetos.md
          - Añadir objetos - append: ut1/02-serializacion/04-append.md
          - serialVersionUID: ut1/02-serializacion/05-versionado.md
