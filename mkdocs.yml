          - SAX: ut1/04-analizadores/03-sax.md
          - JAXB: ut1/04-analizadores/04-jaxb.md
          - Comparativa: ut1/04-analizadores/05-comparativa.md

      - "5. XPath":
          - Introducción: ut1/05-xpath/index.md
          - Rutas y selectores: ut1/05-xpath/01-rutas-selectores.md
          - Predicados y filtros: ut1/05-xpath/02-predicados.md
          - Funciones: ut1/05-xpath/03-funciones.md
          - XPath desde Java: ut1/05-xpath/04-java.md
          - Resumen: ut1/05-xpath/05-resumen.md

      - "6. Conversión XML ↔ JSON":
          - Introducción: ut1/06-conversion/index.md
          - Enfoques: ut1/06-conversion/01-enfoques.md
          - XML → JSON: ut1/06-conversion/02-xml-json.md
          - JSON → XML: ut1/06-conversion/03-json-xml.md
