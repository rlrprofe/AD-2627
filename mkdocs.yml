  - "UT2 · Conexión a bases de datos relacionales (JDBC)":
      - Guía de la unidad: ut2/index.md
      - "2.1. Conceptos y fundamentos de JDBC": ut2/01-fundamentos.md
      - "2.2. Sentencias DDL y DML": ut2/02-sentencias.md
      - "2.3. Procesamiento de resultados": ut2/03-resultados.md
      - "2.4. Transacciones y control de errores": ut2/04-transacciones.md
      - "2.5. Buenas prácticas JDBC": ut2/05-buenas-practicas.md
      - "2.6. Ejercicios y consolidación": ut2/06-actividades.md
      - Proyectos y descargas: ut2/07-descargas.md



markdown_extensions:
  - admonition
  - toc:
      permalink: true
      toc_depth: 4
  - tables
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format