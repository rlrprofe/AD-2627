                  - JSONObject: ut1/03-intercambio/java-json/org-json/02-jsonobject.md
                  - JSONArray: ut1/03-intercambio/java-json/org-json/03-jsonarray.md
                  - Guardar JSON: ut1/03-intercambio/java-json/org-json/04-guardar-json.md
                  - Leer JSON y JSONTokener: ut1/03-intercambio/java-json/org-json/05-leer-json.md
                  - Resumen: ut1/03-intercambio/java-json/org-json/06-resumen.md

              - Gson:
                  - Introducción: ut1/03-intercambio/java-json/gson/index.md
                  - Preparación: ut1/03-intercambio/java-json/gson/01-preparacion.md
                  - Serialización: ut1/03-intercambio/java-json/gson/02-serializacion.md
