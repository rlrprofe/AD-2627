              - dumps() y loads(): ut1/03-intercambio/python-json/02-dumps-loads.md
              - Diccionarios y listas: ut1/03-intercambio/python-json/03-estructuras.md
              - Ficheros JSON: ut1/03-intercambio/python-json/04-ficheros.md
              - pathlib y rutas: ut1/03-intercambio/python-json/05-pathlib.md
              - Tipos personalizados: ut1/03-intercambio/python-json/06-personalizacion.md
              - Resumen: ut1/03-intercambio/python-json/07-resumen.md

