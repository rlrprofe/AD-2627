
site_name: Acceso a Datos - 2º DAM
site_description: Material didáctico del módulo de Acceso a Datos
site_author: Ruth Lospitao Ruiz
site_url: https://rlrprofe.github.io/AD-2627/

repo_url: https://github.com/rlrprofe/AD-2627
repo_name: rlrprofe/AD-2627

theme:
  name: material
  language: es
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

nav:
  - Inicio: index.md

  - "UT1 · Ficheros y formatos de intercambio de datos":
      - Guía de la unidad: ut1/index.md

      - "1. Ficheros, flujos y excepciones":
          - Introducción: ut1/01-ficheros/index.md
          - File y directorios: ut1/01-ficheros/01-file-directorios.md
