<text x="560" y="550" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#334155">// busca descendientes   •   [ ... ] aplica un predicado   •   &gt; compara valores</text>
